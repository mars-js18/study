<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>

  <!-- Glowing background elements -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>

  <!-- Central Symbol: Brain / Flame / Lightning Hybrid -->
  <g transform="translate(106, 106) scale(1.17)" fill="none" stroke="url(#iconGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Orbit Ring -->
    <circle cx="128" cy="128" r="112" stroke-width="12" opacity="0.3" stroke-dasharray="16 12"/>
    
    <!-- Open Book Base -->
    <path d="M 32 176 Q 128 140 128 192 Q 128 140 224 176 L 224 80 Q 128 48 128 96 Q 128 48 32 80 Z" stroke-width="16" fill="rgba(15, 23, 42, 0.6)"/>
    
    <!-- Central Lightning Bolt / Energy Core -->
    <path d="M 136 24 L 88 120 L 132 120 L 120 200 L 176 104 L 132 104 Z" fill="url(#iconGrad)" stroke="url(#iconGrad)" stroke-width="6" filter="url(#glow)"/>
  </g>
</svg>
